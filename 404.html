<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Daily Dose Coffee</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; background: var(--bg); }
    .error-page h1 { font-family: var(--font-heading); font-size: 6rem; color: var(--accent); line-height: 1; margin-bottom: 16px; }
    .error-page p { color: var(--text-light); font-size: 1.1rem; margin-bottom: 32px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .error-langs { display: flex; gap: 24px; justify-content: center; font-size: 0.9rem; color: var(--secondary); }
    .error-langs a { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <h1>404</h1>
      <p>Page not found · Page introuvable · الصفحة غير موجودة</p>
      <div class="error-langs">
        <a href="en/index.html">English</a>
        <a href="fr/index.html">Français</a>
        <a href="ar/index.html">العربية</a>
      </div>
    </div>
  </div>
</body>
</html>
